<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이디 · 비밀번호 찾기 결과 | BRORDER</title>
<link
	href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/find-result.css" />
<script src="/js/resultpw.js"></script>
</head>
<body>

	<main class="wrap panel" id="p3" th:if="${findpw != null}">
		<h1 class="page-title">비밀번호 재설정</h1>

		<form method="post" action="/resultpw" id="resultpw">
			<div class="field">
				<input type="hidden" name="id" th:value="${findpw.id}">
                <p class="result-id" th:text="${findpw.id}"></p>
                <p class="help">조회하신 아이디 입니다.</p>
			</div>

			<div class="field">
				<label for="pw1">새 비밀번호</label> 
				<input id="pw1" type="password" name="password" placeholder="영문, 숫자, 특수문자 조합 8자 이상">
			</div>

			<div class="field">
				<label for="pw2">새 비밀번호 확인</label> 
				<input id="pw2" type="password" name="checkpassword" placeholder="비밀번호를 한 번 더 입력하세요">
			</div>

			<div class="btns">
				<button class="btn btn-crimson" type="button" id="accuse">비밀번호 변경</button>
			</div>
		</form>

		<div class="links">
			<a href="/login">로그인</a><span>| </span><a href="/findid">아이디 찾기</a> <span>|</span><a
				href="#">고객센터</a>
		</div>
	</main>

	<main class="wrap panel" id="p2" th:if="${findpw == null}">
		<h1 class="page-title">비밀번호 찾기</h1>

		<div class="result-box empty">
			<div class="mark no">!</div>
			<p class="result-msg">일치하는 회원 정보가 없습니다</p>
			<p class="result-desc">
				입력한 회원정보를 다시 확인해 주세요.<br>가입 시 사용한 번호가 맞는지도 함께 확인해 주세요.
			</p>
		</div>

		<div class="btns">
			<a class="btn btn-primary" href="/findpw">다시 찾기</a> <a
				class="btn btn-line" href="/register">회원가입</a>
		</div>

		<div class="links">
			<a href="/login">로그인</a><span>|</span><a href="#">고객센터</a>
		</div>
	</main>

</body>
</html>
