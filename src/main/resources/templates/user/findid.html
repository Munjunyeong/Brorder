<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRORDER - 아이디 찾기</title>
<link rel="stylesheet" href="/css/findid.css" />
</head>
<body>

<div class="container">
  <h1 class="page-title">아이디 찾기</h1>

  <form id="findIdForm" method="post">
    <label for="name">이름</label>
    <input type="text" id="name" name="name" placeholder="이름을 입력하세요">

    <label>휴대폰 번호</label>
    <div class="phone-row">
      <input type="tel" name="phone" placeholder="'-' 없이 입력">
      <button type="button" class="btn-verify">인증번호 발송</button>
    </div>

    <button class="submit-btn">아이디 찾기</button>
  </form>

  <div class="footer-links">
    <a href="../findpw">비밀번호 찾기</a> |
    <a href="/login">로그인</a> |
    <a href="/register">회원가입</a>
  </div>
</div>

</body>
</html>
