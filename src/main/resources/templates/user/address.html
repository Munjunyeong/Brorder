<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRORDER - 배달 주소 관리</title>
<link rel="stylesheet" href="/css/address.css" />
</head>
<body>

<div class="container">

  <div class="page-header">
    <div>
      <h1>배달 주소 관리</h1>
      <p>자주 사용하는 주소를 등록하고 빠르게 주문하세요</p>
    </div>
    <button class="btn-add-address" onclick="location.href='address/add'">새 주소 추가</button>
  </div>

  <div class="info-banner">
    <span class="icon">🕐</span>
    <span><b>기본 주소</b>로 설정된 곳으로 주문이 기본 배달됩니다. 최대 <b>5개</b>까지 저장할 수 있어요.</span>
  </div>
  
  <div class="address-card" th:each="item : ${list}">
    <div class="card-top">
      <div class="tags">
        <span class="tag work" th:text="${item.addressname}">🏢 회사</span>
      </div>
      <div class="card-actions">
        <button class="icon-btn" title="수정">✎</button>
        <button class="icon-btn" title="삭제">🗑</button>
      </div>
    </div>
    <div class="address-main" th:text="${item.address + ' ' + item.addressdetail}">서울특별시 마포구 월드컵북로 396</div>
    <div class="address-detail" th:text="${item.addresscomment}">상암DMC 누리꿈스퀘어 7층 · 초인종 눌러주세요</div>
    <div class="card-bottom">
      <span class="used-time" th:text="'공동현관 비밀번호 : ' + ${item.entrance}"></span>
      <button class="btn-set-default">기본 주소로 설정</button>
    </div>
  </div>

  <div class="add-address-box" onclick="location.href='address/add'">
    <span>+</span>
    <span>새 주소 추가하기</span>
  </div>

</div>

</body>
</html>
