<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>음식 주문 사이트 - 판매처 상세</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .detail-box { border: 2px solid #333; padding: 20px; border-radius: 8px; max-width: 500px; }
        .detail-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; display: block; }
        .detail-img-placeholder { width: 100%; height: 200px; background-color: #eee; display: flex; align-items: center; justify-content: center; border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #999; letter-spacing: 2px; }
    </style>
</head>
<body>

<h1>판매처 상세 정보</h1>
<hr>

<div class="detail-box">
    <!-- 대표 이미지가 있을 때 상단에 표시 -->
    <img th:if="${store.titleImage != null and store.titleImage != ''}"
         th:src="@{/upload/{filename}(filename=${store.titleImage})}"
         class="detail-img"
         alt="가게 대표 이미지">
    <!-- 이미지가 없을 때 기존 글자 플레이스홀더 표시 -->
    <div th:if="${store.titleImage == null or store.titleImage == ''}" class="detail-img-placeholder">
        <span>BRORDER</span>
    </div>
    <h2 th:text="${store.name}">대박치킨</h2>
    <p><strong>카테고리:</strong> <span th:text="${store.category}">치킨</span></p>
    <p><strong>전화번호:</strong> <span th:text="${store.phone}">042-123-4567</span></p>
    <p><strong>가게위치:</strong> <span th:text="${store.address}">대전광역시 동구</span></p>
<!--    <p><strong>가게평점:</strong> <span th:text="${'★ ' + store.rating}">★ 5</span></p>-->
    <p><strong>등록일자:</strong> <span th:text="${#temporals.format(store.createdData, 'yyyy-MM-dd HH:mm')}">2026-05-19</span></p>
    <p><strong>현재상태:</strong> <span th:text="${store.status}">OPEN</span></p>
</div>

<h3>🍽️ 메뉴 목록</h3>
<div class="menu-list">
    <!-- 메뉴가 없을 경우 -->
    <div th:if="${#lists.isEmpty(menuList)}" style="padding: 20px; border: 1px dashed #ccc; text-align: center; color: #777;">
        아직 등록된 메뉴가 없습니다.
    </div>

    <!-- 메뉴가 있을 경우 반복문으로 출력 -->
    <div th:each="menu : ${menuList}" class="menu-item">
        <!-- 메뉴 이미지 -->
        <img th:if="${menu.image != null and menu.image != ''}" th:src="@{/upload/{filename}(filename=${menu.image})}" class="menu-pic" alt="메뉴 이미지">
        <div th:unless="${menu.image != null and menu.image != ''}" class="menu-pic-none">No Image</div>

        <!-- 메뉴 정보 -->
        <div class="menu-info">
            <h4 th:text="${menu.name}">황금올리브 치킨</h4>
            <p th:text="${menu.content}">바삭바삭한 식감이 일품인 후라이드</p>
            <div class="menu-price" th:text="${#numbers.formatInteger(menu.price, 0, 'COMMA')} + '원'">20,000원</div>
        </div>

        <!-- 주문(장바구니) 버튼: 옵션 모달을 띄우도록 변경 -->
        <div class="menu-action">
            <button type="button" class="btn-order"
                    th:onclick="openOptionModal([[${menu.menuId}]], [[${menu.name}]], [[${menu.price}]])">
                담기
            </button>
        </div>
    </div>
</div>
<br>
<!-- 목록으로 돌아가기 링크 -->
<a th:href="@{/store/list}">← 판매처 목록으로 돌아가기</a>
<br>

<!-- 옵션 선택 모달 (order/add.html 스타일 참고) -->
<div id="optionModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div style="background: white; width: 95%; max-width: 420px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">

        <div style="padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
            <h3 id="modalMenuName" style="margin: 0; font-size: 20px; font-weight: 800;">메뉴 이름</h3>
            <button onclick="closeOptionModal()" style="border: none; background: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
        </div>

        <div style="padding: 24px; max-height: 400px; overflow-y: auto;">
            <div id="option-container">
                <!-- 옵션들이 동적으로 로드됩니다 -->
            </div>
        </div>

        <div style="padding: 20px; border-top: 1px solid #eee; background: #fafafa;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span style="font-weight: 700; color: #666;">총 주문금액</span>
                <span id="modalTotalPrice" style="font-size: 22px; font-weight: 900; color: #2ac1bc;">0원</span>
            </div>
            <button onclick="addToCartAndGo()" style="width: 100%; padding: 16px; background: #2ac1bc; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; transition: background .2s;">
                장바구니 담기
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let currentMenu = {
        menuId: null,
        name: '',
        basePrice: 0
    };

    function openOptionModal(id, name, price) {
        currentMenu = {
            menuId: id,
            name: name,
            basePrice: price
        };

        document.getElementById('modalMenuName').innerText = name;
        document.getElementById('option-container').innerHTML = '<p style="text-align:center; padding:20px; color:#999;">옵션을 불러오는 중...</p>';
        document.getElementById('optionModal').style.display = 'flex';

        fetch(`/api/menus/${id}/options`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('option-container');
                let html = '';

                if (data && data.length > 0) {
                    const group1 = data.filter(opt => opt.groupId === 1);
                    const group2 = data.filter(opt => opt.groupId === 2);

                    // 기본/사이즈 옵션 (필수 선택 - Radio)
                    if (group1.length > 0) {
                        html += '<div style="margin-bottom: 24px;"><p style="font-weight: 800; margin-bottom: 12px; color: #333;">기본/사이즈 선택</p>';
                        html += group1.map((opt, idx) => `
                            <label style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-bottom: 1px solid #f9f9f9;">
                                <div style="display: flex; align-items: center;">
                                    <input type="radio" name="menuOptionGroup1" value="${opt.price}" data-id="${opt.optionId}" data-name="${opt.name}" onchange="updateModalTotalPrice()" style="margin-right: 12px; width: 20px; height: 20px; accent-color: #2ac1bc;" ${idx === 0 ? 'checked' : ''}>
                                    <span style="font-weight: 500;">${opt.name}</span>
                                </div>
                                <span style="color: #666; font-size: 14px;">${opt.price > 0 ? '+' + opt.price.toLocaleString() + '원' : '기본'}</span>
                            </label>
                        `).join('');
                        html += '</div>';
                    } else {
                        // 기본 옵션이 없을 경우 대비
                        html += `<div style="display:none;"><input type="radio" name="menuOptionGroup1" value="0" data-id="0" data-name="기본" checked></div>`;
                    }

                    // 추가 옵션 (Checkbox)
                    if (group2.length > 0) {
                        html += '<div style="margin-bottom: 10px;"><p style="font-weight: 800; margin-bottom: 12px; color: #333;">추가 옵션</p>';
                        html += group2.map(opt => `
                            <label style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-bottom: 1px solid #f9f9f9;">
                                <div style="display: flex; align-items: center;">
                                    <input type="checkbox" name="menuOptionGroup2" value="${opt.price}" data-id="${opt.optionId}" data-name="${opt.name}" onchange="updateModalTotalPrice()" style="margin-right: 12px; width: 20px; height: 20px; accent-color: #2ac1bc;">
                                    <span style="font-weight: 500;">${opt.name}</span>
                                </div>
                                <span style="color: #666; font-size: 14px;">+${opt.price.toLocaleString()}원</span>
                            </label>
                        `).join('');
                        html += '</div>';
                    }
                } else {
                    html = '<p style="color: #999; font-size: 14px; text-align: center; padding: 20px 0;">선택 가능한 옵션이 없습니다.</p>';
                    // 옵션이 전혀 없을 때도 group1 라디오 하나는 체크된 걸로 간주
                    html += `<div style="display:none;"><input type="radio" name="menuOptionGroup1" value="0" data-id="0" data-name="기본" checked></div>`;
                }

                container.innerHTML = html;
                updateModalTotalPrice();
            })
            .catch(err => {
                console.error('옵션 로드 실패:', err);
                alert('옵션 정보를 불러오지 못했습니다.');
            });
    }

    function closeOptionModal() {
        document.getElementById('optionModal').style.display = 'none';
    }

    function updateModalTotalPrice() {
        let total = currentMenu.basePrice;
        const g1 = document.querySelector('input[name="menuOptionGroup1"]:checked');
        if (g1) total += parseInt(g1.value);

        document.querySelectorAll('input[name="menuOptionGroup2"]:checked').forEach(cb => {
            total += parseInt(cb.value);
        });

        document.getElementById('modalTotalPrice').innerText = total.toLocaleString() + '원';
    }

    function addToCartAndGo() {
        const selectedG1 = document.querySelector('input[name="menuOptionGroup1"]:checked');
        const selectedG2 = Array.from(document.querySelectorAll('input[name="menuOptionGroup2"]:checked'));

        let selectedOptions = [];
        if (selectedG1 && selectedG1.dataset.id !== "0") {
            selectedOptions.push({
                optionId: selectedG1.dataset.id,
                name: selectedG1.dataset.name,
                price: parseInt(selectedG1.value)
            });
        }
        selectedG2.forEach(cb => {
            selectedOptions.push({
                optionId: cb.dataset.id,
                name: cb.dataset.name,
                price: parseInt(cb.value)
            });
        });

        // 세션 스토리지에 옵션 저장 (order/add.html에서 꺼내 씀)
        sessionStorage.setItem('lastSelectedOptions_' + currentMenu.menuId, JSON.stringify(selectedOptions));

        // 폼 생성 및 제출 (장바구니 추가 flow 실행)
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/orders/add';

        const menuInput = document.createElement('input');
        menuInput.type = 'hidden';
        menuInput.name = 'menuId';
        menuInput.value = currentMenu.menuId;
        form.appendChild(menuInput);

        const storeInput = document.createElement('input');
        storeInput.type = 'hidden';
        storeInput.name = 'storeId';
        storeInput.value = /*[[${store.storeId}]]*/ '0';
        form.appendChild(storeInput);

        document.body.appendChild(form);
        form.submit();
    }
</script>
<div style="display: flex; gap: 10px;">
    <!-- ADMIN은 무조건 통과, OWNER는 본인 가게일 때만 통과 -->
    <div th:if="${session.users != null and (session.users.role == 'ADMIN' or (session.users.role == 'OWNER' and session.users.userid == store.userid))}" style="display: flex; gap: 10px;">
        <!-- 수정 화면 이동 -->
        <a th:href="@{/store/{id}/update(id=${store.storeId})}">정보 수정</a>

        <!-- 삭제 요청 처리 -->
        <form th:action="@{/store/{id}/delete(id=${store.storeId})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit" style="color: red;">가게 삭제</button>
        </form>
    </div>
</div>
<hr>

</body>
</html>
