<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/review.css}">
    <style>
        /* ===== store_reviews 전용 보강 스타일 (review.css에 없는 부분만) ===== */

        /* 평점 요약 막대바 카드 */
        .rating-summary-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 28px 32px;
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 24px;
        }

        .rs-score-big {
            text-align: center;
            flex-shrink: 0;
        }

        .rs-score-num {
            font-size: 46px;
            font-weight: 900;
            color: var(--dark-charcoal, #1f2933);
            line-height: 1;
        }

        .rs-score-stars {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin: 8px 0;
        }

        .rs-score-stars i {
            font-size: 15px;
            color: #e8e8e8;
        }

        .rs-score-stars i.on {
            color: var(--star);
        }

        .rs-score-total {
            font-size: 12px;
            color: #b0b5c0;
            font-weight: 600;
        }

        .rs-bars {
            flex: 1;
            min-width: 0;
        }

        .rs-bar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .rs-bar-n {
            font-size: 12px;
            color: #999;
            width: 10px;
            font-weight: 800;
        }

        .rs-bar-bg {
            flex: 1;
            height: 7px;
            background: #f0f1f4;
            border-radius: 10px;
            overflow: hidden;
        }

        .rs-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--teal), #7ffffd);
            border-radius: 10px;
            transition: width .6s cubic-bezier(.22,1,.36,1);
        }

        .rs-bar-count {
            font-size: 12px;
            color: #b0b5c0;
            min-width: 32px;
            text-align: right;
            font-weight: 700;
        }

        /* 리뷰 사진 그리드 (review.css에는 단건 썸네일만 있어 다중 사진용 보강) */
        .review-photos {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .review-photo {
            width: 96px;
            height: 96px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 1.5px solid var(--border-color, #eceef2);
            transition: transform .2s, opacity .2s;
        }

        .review-photo:hover {
            transform: scale(1.04);
            opacity: .9;
        }

        /* 이미지 확대 모달 */
        .img-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .img-modal-overlay.active {
            display: flex;
        }

        .img-modal-box {
            position: relative;
        }

        .img-modal-box img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            display: block;
        }

        .img-modal-close {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ===== 스켈레톤 로딩 (제공해주신 skprod 스타일을 리뷰 카드 형태로 변형) ===== */
        .review-skeleton-wrap {
            display: flex;
            flex-direction: column;
            gap: 18px;
            --sk-dur: 1.4s;
            --sk-hi: rgba(0, 0, 0, .06);
        }

        .sk-hero {
            height: 140px;
            border-radius: var(--radius);
            margin-bottom: 8px;
        }

        .sk-summary {
            height: 110px;
            border-radius: var(--radius);
            margin-bottom: 8px;
        }

        .sk-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px 22px;
            border-radius: var(--radius);
            background: #fff;
            box-shadow: var(--card-shadow);
        }

        .sk-bone {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: rgba(0, 0, 0, .07);
        }

        .sk-bone::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, var(--sk-hi) 50%, transparent 100%);
            animation: sk-wave var(--sk-dur) linear infinite;
        }

        @keyframes sk-wave {
            from { transform: translateX(-100%); }
            to { transform: translateX(200%); }
        }

        .sk-row-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sk-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .sk-line-sm { width: 90px; height: 12px; }
        .sk-line-stars { width: 110px; height: 12px; margin-top: 4px; }
        .sk-line-full { height: 12px; width: 100%; }
        .sk-line-mid { height: 12px; width: 70%; }

        #reviewContent {
            transition: opacity .5s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .sk-bone::after { animation: none; }
        }
    </style>
</head>
<body class="store-review-page">
<th:block th:replace="~{fragments/header :: gnbHeader}"></th:block>

<div class="page-wrapper" th:with=" totalCount=${reviewList != null ? reviewList.size() : 0} ">

    <!-- ===== 스켈레톤 로딩 (초기 노출) ===== -->
    <div id="reviewSkeleton" class="review-skeleton-wrap" aria-busy="true" aria-label="리뷰 불러오는 중">
        <div class="sk-bone sk-hero"></div>
        <div class="sk-bone sk-summary"></div>
        <div class="sk-card" th:each="i : ${#numbers.sequence(1,3)}">
            <div class="sk-row-top">
                <div class="sk-bone sk-avatar"></div>
                <div class="sk-bone sk-line-sm"></div>
            </div>
            <div class="sk-bone sk-line-stars"></div>
            <div class="sk-bone sk-line-full"></div>
            <div class="sk-bone sk-line-mid"></div>
        </div>
    </div>

    <!-- ===== 실제 콘텐츠 (로딩 후 표시) ===== -->
    <div id="reviewContent" style="display:none; opacity:0;">

        <header class="app-hero">
            <div class="store-review-hero-content">
                <div class="hero-badge">
                    <span class="hero-dot"></span> 🏪 상태
                    <strong th:text="${!#lists.isEmpty(reviewList) ? reviewList[0].storeName : '신규 입점 매장'}">홍콩반점</strong>
                </div>
                <h1 class="hero-title">등록된 리뷰</h1>
                <p class="hero-sub">
                    ⭐ 평균 평점
                    <strong th:if="${totalCount > 0}"
                            th:text="${#numbers.formatDecimal(#aggregates.sum(reviewList.![rating]) / totalCount, 1, 1)}">0.0</strong>
                    <strong th:unless="${totalCount > 0}">0.0</strong>
                    &nbsp;·&nbsp; 📋 총 리뷰 <strong th:text="${totalCount + '개'}">0개</strong>
                </p>
            </div>
            <div class="hero-icon-wrap">
                <i class="fa-solid fa-bowl-food store-review-hero-icon"></i>
            </div>
        </header>

        <!-- 평점 분포 요약 -->
        <div class="rating-summary-card" th:if="${totalCount > 0}"
             th:with=" avgValue=${#aggregates.sum(reviewList.![rating]) / totalCount}, avgString=${#numbers.formatDecimal(avgValue, 1, 1)} ">
            <div class="rs-score-big">
                <div class="rs-score-num" th:text="${avgString}">0.0</div>
                <div class="rs-score-stars">
                    <i th:each="num : ${#numbers.sequence(1, 5)}" class="fa-solid fa-star"
                       th:classappend="${num <= avgValue} ? 'on' : ''"></i>
                </div>
                <div class="rs-score-total" th:text="'리뷰 ' + ${totalCount} + '개'">리뷰 0개</div>
            </div>
            <div class="rs-bars">
                <div class="rs-bar-item" th:with="cnt=${#aggregates.sum(reviewList.![rating == 5 ? 1 : 0])}">
                    <span class="rs-bar-n">5</span>
                    <div class="rs-bar-bg">
                        <div class="rs-bar-fill" th:style="'width: ' + (${cnt * 100 / totalCount}) + '%;'"></div>
                    </div>
                    <span class="rs-bar-count" th:text="${cnt + '개'}">0개</span>
                </div>
                <div class="rs-bar-item" th:with="cnt=${#aggregates.sum(reviewList.![rating == 4 ? 1 : 0])}">
                    <span class="rs-bar-n">4</span>
                    <div class="rs-bar-bg">
                        <div class="rs-bar-fill" th:style="'width: ' + (${cnt * 100 / totalCount}) + '%;'"></div>
                    </div>
                    <span class="rs-bar-count" th:text="${cnt + '개'}">0개</span>
                </div>
                <div class="rs-bar-item" th:with="cnt=${#aggregates.sum(reviewList.![rating == 3 ? 1 : 0])}">
                    <span class="rs-bar-n">3</span>
                    <div class="rs-bar-bg">
                        <div class="rs-bar-fill" th:style="'width: ' + (${cnt * 100 / totalCount}) + '%;'"></div>
                    </div>
                    <span class="rs-bar-count" th:text="${cnt + '개'}">0개</span>
                </div>
                <div class="rs-bar-item" th:with="cnt=${#aggregates.sum(reviewList.![rating == 2 ? 1 : 0])}">
                    <span class="rs-bar-n">2</span>
                    <div class="rs-bar-bg">
                        <div class="rs-bar-fill" th:style="'width: ' + (${cnt * 100 / totalCount}) + '%;'"></div>
                    </div>
                    <span class="rs-bar-count" th:text="${cnt + '개'}">0개</span>
                </div>
                <div class="rs-bar-item" th:with="cnt=${#aggregates.sum(reviewList.![rating == 1 ? 1 : 0])}">
                    <span class="rs-bar-n">1</span>
                    <div class="rs-bar-bg">
                        <div class="rs-bar-fill" th:style="'width: ' + (${cnt * 100 / totalCount}) + '%;'"></div>
                    </div>
                    <span class="rs-bar-count" th:text="${cnt + '개'}">0개</span>
                </div>
            </div>
        </div>

        <!-- 리뷰 없음 -->
        <div class="empty-box" th:if="${totalCount == 0}">
            <div class="empty-icon"><i class="fa-solid fa-shop-slash"></i></div>
            <div class="empty-t">현재 개장 준비 중인 매장입니다</div>
            <div class="empty-s">조금만 기다려주시면 맛있는 메뉴로 찾아뵙겠습니다!</div>
        </div>

        <!-- 리뷰 리스트 -->
        <section class="review-panel" th:unless="${totalCount == 0}">
            <div class="review-panel-header">
                <i class="fa-solid fa-comments review-panel-head-icon"></i>
                <span class="review-panel-title">리뷰 목록</span>
                <span class="count-pill" th:text="${totalCount + '개'}">0개</span>
            </div>

            <div class="review-card" th:each="review, iter : ${reviewList}" th:attr="data-delay=${iter.index * 80}">
                <div class="card-top-strip"></div>
                <div class="card-inner">
                    <div class="card-head">
                        <div class="user-pill">
                            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                            <span class="user-name" th:text="${review.userIdName}">user1</span>
                        </div>
                        <span class="date-label"
                              th:text="${#temporals.format(review.createdData, 'yyyy.MM.dd HH:mm')}">2026.06.09 10:25</span>
                    </div>

                    <div class="stars-row">
                        <div class="stars">
                            <i th:each="s : ${#numbers.sequence(1,5)}" class="fa-solid fa-star s-icon"
                               th:classappend="${s <= review.rating} ? 'on' : ''"></i>
                        </div>
                        <span class="rating-text" th:text="${review.rating + '.0'}">5.0</span>
                    </div>

                    <span class="menu-chip" th:if="${review.menuName != null and review.menuName != ''}">
                        <i class="fa-solid fa-utensils menu-chip-icon"></i>
                        <span th:text="${review.menuName}">짜장면</span>
                    </span>

                    <p class="review-body" th:text="${review.content}">음식이 정말 맛있어요!</p>

                    <div th:if="${review.picture != null and !#strings.isEmpty(review.picture)}" class="review-photos">
                        <img th:src="'/upload/' + ${review.picture}" class="review-photo" alt="리뷰 사진"
                             th:onclick="openImageModal([['/upload/' + ${review.picture}]])"/>
                    </div>
                    <div th:unless="${review.picture != null and !#strings.isEmpty(review.picture)}" class="img-chip">
                        <i class="fa-regular fa-image"></i> 사진 없음
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<div class="img-modal-overlay" id="imageLargeModal" onclick="closeImageModal()">
    <div class="img-modal-box" onclick="event.stopPropagation()">
        <button class="img-modal-close" onclick="closeImageModal()">&times;</button>
        <img id="modalTargetImg" src="" alt="확대 보기">
    </div>
</div>

<script th:src="@{/js/review.js}"></script>
<th:block th:replace="~{fragments/footer :: defaultFooter}"></th:block>
<script>
    function openImageModal(imgSrc) {
        const modal = document.getElementById('imageLargeModal');
        const modalImg = document.getElementById('modalTargetImg');
        modalImg.src = imgSrc;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeImageModal() {
        const modal = document.getElementById('imageLargeModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    // 스켈레톤 → 실제 콘텐츠 전환
    window.addEventListener('load', () => {
        setTimeout(() => {
            const skeleton = document.getElementById('reviewSkeleton');
            const content = document.getElementById('reviewContent');

            skeleton.style.display = 'none';
            content.style.display = 'block';
            requestAnimationFrame(() => { content.style.opacity = '1'; });

            // 리뷰 카드 순차 페이드인 (review.js의 카드 관찰 로직이 주석 처리돼있어 여기서 처리)
            document.querySelectorAll('.review-card').forEach(card => {
                const delay = card.dataset.delay || 0;
                setTimeout(() => card.classList.add('card-visible'), parseInt(delay));
            });
        }, 450);
    });
</script>
</body>
</html>
